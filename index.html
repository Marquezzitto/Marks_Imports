<style>
  :root{
    --bg:#101018; --card:#1a1a24; --card2:#22222e; --text:#f2f2f5; --muted:#9a9aa8;
    --accent:#f97316; --accent2:#fb923c; --border:#2c2c3a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  header{position:sticky;top:0;z-index:50;background:rgba(16,16,24,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .bar{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 20px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;letter-spacing:.5px}
  .logo img{width:42px;height:42px;border-radius:10px;object-fit:cover}
  .logo span{color:var(--accent)}
  .search{flex:1;min-width:200px}
  .search input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.95rem;outline:none}
  .search input:focus{border-color:var(--accent)}
  .hero{max-width:1200px;margin:0 auto;padding:48px 20px 24px;text-align:center}
  .hero h1{font-size:clamp(1.6rem,4vw,2.6rem);font-weight:800}
  .hero h1 span{color:var(--accent)}
  .hero p{color:var(--muted);margin-top:10px}
  .filters{max-width:1200px;margin:0 auto;padding:8px 20px 20px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .chip{padding:8px 16px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;font-size:.85rem;transition:.15s}
  .chip:hover{border-color:var(--accent);color:var(--text)}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .grid{max-width:1200px;margin:0 auto;padding:10px 20px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:.2s}
  .card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 12px 30px rgba(249,115,22,.12)}
  .photo{position:relative;aspect-ratio:1;background:var(--card2)}
  .photo img{width:100%;height:100%;object-fit:cover}
  .tag{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.65);color:#fff;font-size:.72rem;padding:4px 10px;border-radius:999px;backdrop-filter:blur(4px)}
  .body{padding:14px;display:flex;flex-direction:column;gap:10px;flex:1}
  .name{font-weight:700;font-size:1rem}
  .desc{color:var(--muted);font-size:.8rem;line-height:1.35}
  .optlabel{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .colors{display:flex;gap:6px;flex-wrap:wrap}
  .colorbtn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:.78rem;cursor:pointer;transition:.15s}
  .colorbtn.sel{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:.85rem}
  .price{margin-top:auto}
  .vista{font-size:1.3rem;font-weight:800;color:var(--accent2)}
  .parc{color:var(--muted);font-size:.82rem}
  .buy{display:block;text-align:center;margin-top:10px;background:#25D366;color:#fff;font-weight:700;padding:12px;border-radius:10px;text-decoration:none;font-size:.95rem;transition:.15s}
  .buy:hover{background:#1fb857}
  footer{border-top:1px solid var(--border);padding:30px 20px;text-align:center;color:var(--muted);font-size:.85rem}
  footer img{width:48px;height:48px;border-radius:12px;vertical-align:middle;margin-bottom:8px}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;grid-column:1/-1}
</style>
</head>

const categorias = [...new Set(PRODUTOS.map(p => p.categoria))];
let catAtiva = "Todos", termo = "";
const escolhas = {}; // índice -> {cor, tamanho}

const grid = document.getElementById("grid");
const filtros = document.getElementById("filtros");

function renderFiltros(){
  filtros.innerHTML = "";
  ["Todos", ...categorias].forEach(c => {
    const b = document.createElement("button");
    b.className = "chip" + (c === catAtiva ? " active" : "");
    b.textContent = c;
    b.onclick = () => { catAtiva = c; renderFiltros(); renderGrid(); };
    filtros.appendChild(b);
  });
}

function renderGrid(){
  grid.innerHTML = "";
  const lista = PRODUTOS.filter(p =>
    (catAtiva === "Todos" || p.categoria === catAtiva) &&
    (p.nome + " " + p.desc).toLowerCase().includes(termo)
  );
  if (!lista.length){ grid.innerHTML = '<div class="empty">Nenhum produto encontrado.</div>'; return; }

  lista.forEach(p => {
    const i = PRODUTOS.indexOf(p);
    if (!escolhas[i]) escolhas[i] = { cor: p.cores[0] || null, tamanho: p.tamanhos[0] || null };
    const vista = precoFinal(p.base), parc = valorParcela(vista);

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="photo">
        ${p.imagem ? `<img loading="lazy" src="${p.imagem}" alt="${p.nome}">` : ""}
        ${p.cores.length ? `<span class="tag" data-tag>Cor: ${escolhas[i].cor}</span>` : ""}
      </div>
      <div class="body">
        <div class="name">${p.nome}</div>
        <div class="desc">${p.desc}</div>
        ${p.cores.length ? `<div><div class="optlabel">Cor</div><div class="colors" data-cores></div></div>` : ""}
        ${p.tamanhos.length ? `<div><div class="optlabel">Tamanho</div><select data-tam>${p.tamanhos.map(t=>`<option>${t}</option>`).join("")}</select></div>` : ""}
        <div class="price">
          <div class="vista">${brl(vista)}</div>
          <div class="parc">ou ${PARCELAS}x de ${brl(parc)} no cartão</div>
        </div>
        <a class="buy" target="_blank" rel="noopener">Comprar no WhatsApp</a>
      </div>`;

    const coresBox = card.querySelector("[data-cores]");
    if (coresBox){
      p.cores.forEach(c => {
        const b = document.createElement("button");
        b.className = "colorbtn" + (c === escolhas[i].cor ? " sel" : "");
        b.textContent = c === escolhas[i].cor ? "✓ " + c : c;
        b.onclick = () => {
          escolhas[i].cor = c;
          coresBox.querySelectorAll(".colorbtn").forEach(x => { x.classList.remove("sel"); x.textContent = x.textContent.replace("✓ ",""); });
          b.classList.add("sel"); b.textContent = "✓ " + c;
          card.querySelector("[data-tag]").textContent = "Cor: " + c;
          atualizarLink();
        };
        coresBox.appendChild(b);
      });
    }
    const sel = card.querySelector("[data-tam]");
    if (sel) sel.onchange = () => { escolhas[i].tamanho = sel.value; atualizarLink(); };

    function atualizarLink(){
      const e = escolhas[i];
      let msg = `Olá! Quero comprar: ${p.nome}`;
      if (e.cor) msg += ` | Cor: ${e.cor}`;
      if (e.tamanho) msg += ` | Tamanho: ${e.tamanho}`;
      msg += ` | Valor: ${brl(vista)} à vista ou ${PARCELAS}x de ${brl(parc)}`;
      card.querySelector(".buy").href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`;
    }
    atualizarLink();
    grid.appendChild(card);
  });
}

document.getElementById("busca").oninput = e => { termo = e.target.value.toLowerCase(); renderGrid(); };
renderFiltros();
renderGrid();
</script>
